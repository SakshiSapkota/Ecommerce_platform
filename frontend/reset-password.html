<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password - SajhaMart</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
<nav class="navbar"><div class="nav-inner"><a href="index.html" class="nav-logo">Sajha<span class="ac">Mart</span></a></div></nav>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding-top:var(--nav-h)">
  <div style="background:var(--bg-white);border:1px solid var(--border);border-radius:var(--r-2xl);padding:2.5rem;width:100%;max-width:420px;box-shadow:var(--shadow-xl)">
    <div style="text-align:center;margin-bottom:1.75rem">
      <div style="font-size:3rem;margin-bottom:.75rem">🔐</div>
      <h1 style="font-size:1.625rem;font-weight:800;margin-bottom:.375rem">Reset Password</h1>
      <p style="color:var(--text-muted);font-size:.9375rem">Enter your new password below.</p>
    </div>

    <div class="alert alert-error" id="err-box" style="display:none"></div>
    <div id="invalid-token" style="display:none">
      <div class="alert alert-error">Invalid or expired reset link. <a href="forgot-password.html">Request a new one</a>.</div>
    </div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="input-wrap" style="position:relative"><span class="input-icon">🔒</span>
          <input class="form-input" type="password" id="password" placeholder="Min 6 characters">
          <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('password',this)">👁</button></div>
        <span class="form-error-msg" id="e-pw"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <div class="input-wrap" style="position:relative"><span class="input-icon">🔒</span>
          <input class="form-input" type="password" id="confirm-pw" placeholder="Repeat password">
          <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('confirm-pw',this)">👁</button></div>
        <span class="form-error-msg" id="e-cpw"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">Reset Password</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
const token=new URLSearchParams(location.search).get('token');
if(!token){document.getElementById('reset-form').style.display='none';document.getElementById('invalid-token').style.display='block';}
else{
  API.get('/api/verify-reset/'+token).then(r=>{if(!r.valid){document.getElementById('reset-form').style.display='none';document.getElementById('invalid-token').style.display='block';}});
}
document.getElementById('reset-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=document.getElementById('password').value;
  const cpw=document.getElementById('confirm-pw').value;
  document.getElementById('e-pw').textContent='';document.getElementById('e-cpw').textContent='';
  if(pw.length<6){document.getElementById('e-pw').textContent='Min 6 characters';return;}
  if(pw!==cpw){document.getElementById('e-cpw').textContent='Passwords do not match';return;}
  const btn=document.getElementById('submit-btn'); btn.disabled=true; btn.textContent='Resetting…';
  const r=await API.post('/api/reset-password',{token,password:pw,confirm:cpw});
  if(r.success){showToast('Password reset! Please sign in.','success');setTimeout(()=>location.href='login.html',1200);}
  else{document.getElementById('err-box').textContent=r.error||'Failed';document.getElementById('err-box').style.display='flex';btn.disabled=false;btn.textContent='Reset Password';}
});
</script>
</body></html>
