<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password - SajhaMart</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
<nav class="navbar"><div class="nav-inner"><a href="index.html" class="nav-logo">Sajha<span class="ac">Mart</span></a></div></nav>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding-top:var(--nav-h)">
  <div style="background:var(--bg-white);border:1px solid var(--border);border-radius:var(--r-2xl);padding:2.5rem;width:100%;max-width:420px;box-shadow:var(--shadow-xl)">
    <div style="text-align:center;margin-bottom:1.75rem">
      <div style="font-size:3rem;margin-bottom:.75rem">🔑</div>
      <h1 style="font-size:1.625rem;font-weight:800;margin-bottom:.375rem">Forgot Password?</h1>
      <p style="color:var(--text-muted);font-size:.9375rem">Enter your email and we'll send a reset link (simulated).</p>
    </div>

    <div class="alert alert-error" id="err-box" style="display:none"></div>
    <div class="alert alert-success" id="ok-box" style="display:none"></div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap"><span class="input-icon">📧</span>
          <input class="form-input" type="email" id="email" placeholder="you@example.com"></div>
        <span class="form-error-msg" id="e-email"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">Send Reset Link</button>
    </form>

    <div id="token-box" style="display:none;margin-top:1.25rem">
      <div class="alert alert-info">
        <div>
          <strong>Lab Simulation:</strong> No email was sent. Copy the link below to reset your password.<br><br>
          <a id="reset-link" href="#" style="color:var(--primary);word-break:break-all;font-size:.875rem"></a>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin-top:1.25rem">
      <a href="login.html" style="font-size:.9375rem;color:var(--primary)">← Back to Sign In</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const eb=document.getElementById('err-box'), ob=document.getElementById('ok-box');
  eb.style.display='none'; ob.style.display='none';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    document.getElementById('e-email').textContent='Valid email required'; return;
  }
  const btn=document.getElementById('submit-btn'); btn.disabled=true; btn.textContent='Sending…';
  const r=await API.post('/api/forgot-password',{email});
  if(r.success){
    ob.textContent=r.message; ob.style.display='flex';
    if(r.reset_url){
      const tb=document.getElementById('token-box'), rl=document.getElementById('reset-link');
      tb.style.display='block'; rl.href=r.reset_url; rl.textContent=r.reset_url;
    }
    btn.textContent='Sent!';
  } else {
    eb.textContent=r.errors?.email||r.error||'Failed'; eb.style.display='flex';
    btn.disabled=false; btn.textContent='Send Reset Link';
  }
});
</script>
</body></html>
